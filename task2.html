<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Contact Form</title>
</head>
<body>
    <nav class=" container navbar border-bottom ">
        <a href="index.html">Task 0</a>
        <a href="task1.html">Task 1</a>
        <a href="task2.html">Task 2</a>
        <a href="task3.html">Task 3</a>
        <a href="task4.html">Task 4</a>
    </nav>
    <main class="container py-4">
        <form class="row g-3">
            <div class="col-md-6">
                <label for="name" class="form-label">Name:</label>
                <input type="text" class="form-control" id="name" name="name" required maxlength="50" placeholder="Enter your name">
            </div>
            <div class="col-md-6 " >
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" name="email" required  aria-describedby="emailHelp" placeholder="Enter your email">
                <div id="emailHelp" class="form-text">
                     Example: name@example.com
                </div>
            </div>
            <div class="col-12">
                <label for="message" class="form-label">Message:</label>
                <textarea class="form-control" id="message" name="message" required minlength="10" maxlength="500" rows="4" placeholder="Enter your message"></textarea>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
        
        </form>
    </main>
</body>
</html>
